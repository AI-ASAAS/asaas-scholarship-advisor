services:
  - type: web
    name: asaas-scholarships-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/system/status
    envVars:
      - key: DATABASE_URL
        value: sqlite:///grants.db
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_API_KEY
        value: ""
      - key: TAVILY_API_KEY
        value: ""
      - key: SERPER_API_KEY
        value: ""
